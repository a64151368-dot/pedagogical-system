<style>
/* Layout: the night study scene as a framed picture; on wide screens the three holographic panels float over the night city beside the moon, on narrow screens they line up under the picture */
:root {
  --night: #100f2a;
  --night-2: #1d1a48;
  --holo: #8fb4ff;
  --holo-soft: 120, 165, 255;
  --ink: #e8efff;
  --ember: #ffb15a;
  --ember-rgb: 255, 170, 80;
  --font-display: "Philosopher", "Georgia", serif;
  --font-ui: "Exo 2", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(ellipse at 70% 0%, var(--night-2), var(--night) 65%);
  color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  font-family: var(--font-ui);
}
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 16px; }
h1 {
  margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.6rem, 4.6vw, 2.7rem); letter-spacing: .01em; color: var(--ink);
  text-shadow: 0 0 22px rgba(var(--holo-soft), .55); text-wrap: balance;
}
h1 span { color: var(--ember); text-shadow: 0 0 18px rgba(var(--ember-rgb), .6); }

.scene { position: relative; container-type: inline-size; container-name: scene; display: grid; gap: 14px; }
.art {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 1672 / 941;
  border-radius: 18px; overflow: hidden;
  background: url("jku79bb3.png") center / cover no-repeat var(--night);
  box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--holo-soft), .25), 0 0 40px rgba(var(--holo-soft), .12);
}
.art canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* moon halo and breathing holograms over the still painting */
.halo, .holo-glow { position: absolute; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: screen; }
.halo {
  left: 75.6%; top: 11.6%; width: 17%; aspect-ratio: 1;
  background: radial-gradient(circle, rgba(200,220,255,.35) 0%, rgba(160,190,255,.14) 35%, transparent 65%);
  animation: breathe 7s ease-in-out infinite;
}
.holo-glow {
  border-radius: 14px; transform: none;
  background: radial-gradient(ellipse at center, rgba(var(--holo-soft), .32), rgba(var(--holo-soft), .08) 60%, transparent 80%);
  animation: flicker 5s ease-in-out infinite;
}
.holo-glow::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, transparent 0%, rgba(190,215,255,.35) 50%, transparent 100%) no-repeat;
  background-size: 100% 22%; animation: scan 4.5s linear infinite; opacity: .7;
}
.g1 { left: 44.8%; top: 5.9%;  width: 15.5%; height: 18.5%; }
.g2 { left: 45.7%; top: 40%;   width: 11.6%; height: 17%;  animation-delay: -1.3s; }
.g3 { left: 83.5%; top: 8.1%;  width: 11.3%; height: 20.3%; animation-delay: -2.4s; }
.g4 { left: 86.7%; top: 31.1%; width: 10%;   height: 18.1%; animation-delay: -3.1s; }
.g5 { left: 82%;   top: 53.6%; width: 13.4%; height: 17.2%; animation-delay: -.7s; }
.g1::after { animation-delay: -1s; } .g3::after { animation-delay: -2s; } .g5::after { animation-delay: -3s; }
@keyframes breathe { 0%,100% { opacity: .65; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } }
@keyframes flicker { 0%,100% { opacity: .35; } 45% { opacity: .9; } 50% { opacity: .55; } 55% { opacity: .95; } }
@keyframes scan { from { background-position: 0 -30%; } to { background-position: 0 130%; } }

/* holographic panels = navigation */
.panels {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
}
.panel {
  position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px;
  padding: 12px 16px 12px 12px; border-radius: 14px; text-decoration: none; color: var(--ink);
  background: linear-gradient(160deg, rgba(60,80,170,.42), rgba(25,30,80,.55));
  border: 1px solid rgba(var(--holo-soft), .6);
  box-shadow: 0 0 0 1px rgba(var(--holo-soft), .12) inset, 0 0 18px rgba(var(--holo-soft), .35), inset 0 0 22px rgba(var(--holo-soft), .18);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  -webkit-tap-highlight-color: transparent; min-width: 0;
}
/* amber light trail along the lower edge, like the swirls in the picture */
.panel::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--ember) 30%, #fff1d8 50%, var(--ember) 70%, transparent);
  box-shadow: 0 0 8px rgba(var(--ember-rgb), .9); opacity: .75; transform: scaleX(.6);
  transition: transform .35s ease, opacity .35s ease;
}
a.panel:hover, a.panel:focus-visible {
  transform: translateY(-3px); border-color: rgba(var(--ember-rgb), .85);
  box-shadow: 0 0 0 1px rgba(var(--ember-rgb), .2) inset, 0 0 26px rgba(var(--ember-rgb), .45), inset 0 0 22px rgba(var(--holo-soft), .2);
}
a.panel:hover::after, a.panel:focus-visible::after { transform: scaleX(1); opacity: 1; }
.panel:focus-visible, .pill:focus-visible, .music:focus-visible { outline: 2px dashed var(--ember); outline-offset: 3px; }
.icon {
  width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
  border: 1px solid rgba(var(--holo-soft), .55); background: rgba(var(--holo-soft), .12);
  box-shadow: inset 0 0 12px rgba(var(--holo-soft), .35);
}
.icon svg { width: 28px; height: 28px; stroke: var(--holo); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(var(--holo-soft), .9)); }
.txt { display: grid; gap: 2px; min-width: 0; }
.label { font-weight: 600; font-size: 1.06rem; line-height: 1.2; text-wrap: balance; }
.meta { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--holo); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill {
  font-family: var(--font-ui); font-weight: 600; font-size: .84rem; text-decoration: none; white-space: nowrap;
  color: #2a1404; padding: .32em .9em; border-radius: 999px;
  background: linear-gradient(180deg, #ffe2b8, var(--ember) 65%, #f08a2c);
  box-shadow: 0 0 0 1px rgba(255,240,215,.6), 0 0 10px rgba(var(--ember-rgb), .7);
  transition: transform .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.pill:hover, .pill:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 1px #fff4e2, 0 0 16px 3px rgba(var(--ember-rgb), .85); }

/* wide screens: panels float over the city between the hologram columns */
@container scene (min-width: 980px) {
  .panels {
    position: absolute; left: 61.6%; top: 23%; width: 20.2%;
    grid-template-columns: 1fr; gap: 10px;
  }
  .panel { padding: 10px 12px 10px 10px; gap: 10px; }
  .icon { width: 40px; height: 40px; }
  .icon svg { width: 24px; height: 24px; }
  .label { font-size: .98rem; }
  .meta { font-size: .7rem; }
  .pill { font-size: .78rem; }
}

/* music toggle */
.music {
  position: absolute; z-index: 5; top: 12px; left: 12px;
  display: inline-flex; align-items: center; gap: .5em;
  font-family: var(--font-ui); font-weight: 500; font-size: clamp(12px, 1.6cqw, 15px);
  color: var(--ink); background: rgba(20,24,70,.6); border: 1px solid rgba(var(--holo-soft), .55);
  padding: .45em .9em; border-radius: 999px; cursor: pointer;
  box-shadow: 0 0 12px rgba(var(--holo-soft), .3);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  transition: background .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.music:hover { background: rgba(30,36,95,.8); border-color: rgba(var(--ember-rgb), .8); box-shadow: 0 0 14px rgba(var(--ember-rgb), .5); }
.music .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: .9em; }
.music .bars i { width: 3px; height: 30%; background: var(--ember); border-radius: 2px; }
.music.on .bars i { animation: bar 1.2s ease-in-out infinite; }
.music.on .bars i:nth-child(2) { animation-delay: .3s; }
.music.on .bars i:nth-child(3) { animation-delay: .6s; }
@keyframes bar { 0%,100% { height: 30%; } 50% { height: 100%; } }

/* sparkle burst on click */
.spark {
  position: absolute; z-index: 6; width: 7px; height: 7px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff, var(--ember) 45%, transparent 70%);
  animation: burst .9s ease-out forwards;
}
@keyframes burst {
  from { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .halo, .holo-glow, .holo-glow::after, .music.on .bars i { animation: none; }
  .holo-glow::after { display: none; }
  .music.on .bars i { height: 70%; }
}
</style>

<script>
/* twinkling stars in the sky and amber motes drifting up from the light trails */
(function () {
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var cv = document.getElementById('sky'), c = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, stars = [], motes = [];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  // sky regions free of the girl and shelves (fractions of the picture)
  function skyPoint() {
    for (var k = 0; k < 20; k++) {
      var x = rnd(.36, 1), y = rnd(0, .48);
      var inPanel = (x > .44 && x < .61 && (y < .25 || (y > .39 && y < .58))) || (x > .81 && y > .07);
      var inMoon = Math.hypot(x - .756, (y - .116) * .56) < .05;
      if (!inPanel && !inMoon) return [x, y];
    }
    return [rnd(.62, .8), rnd(.02, .3)];
  }
  function seed() {
    stars = [];
    for (var i = 0; i < 70; i++) { var p = skyPoint(); stars.push({ x: p[0], y: p[1], r: rnd(.4, 1.3), ph: rnd(0, 6.28), sp: rnd(.6, 1.8) }); }
    motes = [];
    for (var j = 0; j < 26; j++) motes.push(newMote(true));
  }
  function newMote(anywhere) {
    // rise from the warm swirls: lower left books, the laptop, the pencil cup on the right
    var src = [[.05, .2, .62, .95], [.42, .62, .82, .98], [.82, 1, .55, .95]][Math.floor(Math.random() * 3)];
    return { x: rnd(src[0], src[1]), y: anywhere ? rnd(.3, src[3]) : rnd(src[2], src[3]), vy: rnd(.012, .03), dx: rnd(-.006, .006), r: rnd(.8, 2), life: rnd(0, 1), ph: rnd(0, 6.28) };
  }
  function size() {
    var r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  var last = 0;
  function frame(t) {
    var dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    c.clearRect(0, 0, W, H);
    var k = W / 1000;
    stars.forEach(function (s) {
      var a = reduce ? .7 : .35 + .65 * Math.pow((Math.sin(t / 1000 * s.sp + s.ph) + 1) / 2, 2);
      c.globalAlpha = a; c.fillStyle = '#e6eeff';
      c.beginPath(); c.arc(s.x * W, s.y * H, s.r * k + .3, 0, 6.283); c.fill();
      if (s.r > 1.1 && a > .85) { c.globalAlpha = a * .5; c.fillRect(s.x * W - 3 * k, s.y * H - .3, 6 * k, .6); c.fillRect(s.x * W - .3, s.y * H - 3 * k, .6, 6 * k); }
    });
    if (!reduce) {
      motes.forEach(function (m, i) {
        m.y -= m.vy * dt; m.x += (m.dx + Math.sin(t / 900 + m.ph) * .004) * dt; m.life += dt * .18;
        var a = Math.sin(Math.min(1, m.life) * Math.PI);
        if (m.life >= 1 || m.y < .25) { motes[i] = newMote(false); motes[i].life = 0; return; }
        var g = c.createRadialGradient(m.x * W, m.y * H, 0, m.x * W, m.y * H, m.r * 3 * k + 2);
        g.addColorStop(0, 'rgba(255,236,200,' + a + ')'); g.addColorStop(.4, 'rgba(255,170,80,' + a * .6 + ')'); g.addColorStop(1, 'rgba(255,150,60,0)');
        c.globalAlpha = 1; c.fillStyle = g;
        c.beginPath(); c.arc(m.x * W, m.y * H, m.r * 3 * k + 2, 0, 6.283); c.fill();
      });
      requestAnimationFrame(frame);
    }
    c.globalAlpha = 1;
  }
  size(); seed();
  window.addEventListener('resize', function () { size(); if (reduce) frame(0); });
  requestAnimationFrame(frame);
})();

/* chime and sparkle on every link */
(function () {
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var ctx = null;
  function chime() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume();
      var now = ctx.currentTime, master = ctx.createGain();
      master.gain.value = 0.22; master.connect(ctx.destination);
      [1046.5, 1318.5, 1568, 2093, 2637, 3136].forEach(function (f, i) {
        var t = now + i * 0.07;
        [1, 2.01].forEach(function (mult, k) {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = f * mult;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(k === 0 ? 0.5 : 0.12, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
          o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.3);
        });
      });
    } catch (e) {}
  }
  function sparkle(el) {
    if (reduce) return;
    var scene = document.getElementById('scene');
    var r = el.getBoundingClientRect(), s = scene.getBoundingClientRect();
    var cx = r.left + r.width / 2 - s.left, cy = r.top + r.height / 2 - s.top;
    for (var i = 0; i < 16; i++) {
      var p = document.createElement('span'); p.className = 'spark';
      var a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d * 0.6 + 'px');
      scene.appendChild(p);
      setTimeout(function (n) { n.remove(); }.bind(null, p), 950);
    }
  }
  document.querySelectorAll('a.panel, a.pill').forEach(function (a) {
    a.addEventListener('click', function () { chime(); sparkle(a); });
  });
})();
</script>

<script>
/* Gentle music-box melody over a soft pad, generated live in the browser */
(function () {
  var btn = document.getElementById('music'), label = document.getElementById('musicLabel');
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { btn.hidden = true; return; }
  var ctx, master, wet, timer = null, playing = false, wanted = true, beat = 0, nextTime = 0, lastDeg = 4;
  try { if (localStorage.getItem('stairsMusic') === 'off') wanted = false; } catch (e) {}

  var BEAT = 0.82;
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  var chords = [
    { root: 50, tones: [62, 66, 69, 73] },
    { root: 47, tones: [62, 66, 69, 71] },
    { root: 43, tones: [62, 67, 71, 66] },
    { root: 45, tones: [62, 64, 69, 71] }
  ];
  var scale = [74, 76, 78, 81, 83, 86, 88, 90];

  function build() {
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    master.connect(lp); lp.connect(ctx.destination);
    var len = ctx.sampleRate * 3.5, imp = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = imp.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    var conv = ctx.createConvolver(); conv.buffer = imp;
    wet = ctx.createGain(); wet.gain.value = 0.55;
    wet.connect(conv); conv.connect(master);
  }
  function out(node, dry) { var g = ctx.createGain(); g.gain.value = dry; node.connect(g); g.connect(master); node.connect(wet); }
  function bell(t, m, vol) {
    [[1, 1], [2.0, .22], [3.01, .07]].forEach(function (p) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(m) * p[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * p[1], t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 / p[0]);
      o.connect(g); out(g, .7); o.start(t); o.stop(t + 2.8);
    });
  }
  function pad(t, ch) {
    var dur = BEAT * 8 + 1.5;
    ch.tones.concat([ch.root]).forEach(function (m, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i === 4 ? 'sine' : 'triangle';
      o.frequency.value = hz(m); o.detune.value = (i % 2 ? 4 : -4);
      var v = i === 4 ? 0.09 : 0.022;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 2.2);
      g.gain.setValueAtTime(v, t + dur - 2.4);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); out(g, .5); o.start(t); o.stop(t + dur + .1);
    });
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 1.2) {
      var bar = Math.floor(beat / 8) % 4, pos = beat % 8, ch = chords[bar];
      if (pos === 0) pad(nextTime, ch);
      var play = pos === 0 || pos === 3 || (pos !== 7 && Math.random() < 0.42);
      if (play) {
        var step = [-2, -1, -1, 1, 1, 2, 0][Math.floor(Math.random() * 7)];
        lastDeg = Math.max(0, Math.min(scale.length - 1, lastDeg + step));
        var note = scale[lastDeg];
        if (pos === 0) {
          var best = ch.tones[0] + 12, bd = 99;
          ch.tones.forEach(function (tn) { [tn + 12, tn + 24].forEach(function (x) { var dd = Math.abs(x - note); if (dd < bd) { bd = dd; best = x; } }); });
          note = best;
        }
        bell(nextTime + (Math.random() * 0.03), note, pos === 0 ? 0.16 : 0.11);
        if (Math.random() < 0.12) bell(nextTime + BEAT / 2, note + 12, 0.05);
      }
      nextTime += BEAT; beat++;
    }
  }
  function setUI() {
    btn.classList.toggle('on', playing);
    btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    label.textContent = playing ? 'Вимкнути мелодію' : 'Увімкнути мелодію';
  }
  function start() {
    try {
      if (!ctx) build();
      if (ctx.state === 'suspended') ctx.resume();
      if (playing) return;
      playing = true;
      nextTime = ctx.currentTime + 0.15;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 3);
      schedule(); timer = setInterval(schedule, 300);
      setUI();
    } catch (e) {}
  }
  function stop(fast) {
    if (!ctx || !playing) return;
    playing = false; clearInterval(timer); timer = null;
    var t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0, t + (fast ? 0.6 : 1.5));
    setUI();
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (playing) { wanted = false; stop(); } else { wanted = true; start(); }
    try { localStorage.setItem('stairsMusic', wanted ? 'on' : 'off'); } catch (er) {}
  });
  document.addEventListener('pointerdown', function first(e) {
    if (e.target.closest('a, .music')) return;
    document.removeEventListener('pointerdown', first);
    if (wanted && !playing) start();
  });
  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    a.addEventListener('click', function () { stop(true); });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (playing) stop(true); }
    else if (wanted && ctx) start();
  });
  window.addEventListener('focus', function () { if (wanted && ctx && !playing && !document.hidden) start(); });
  setUI();
})();
</script>
